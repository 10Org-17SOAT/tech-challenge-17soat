# Demo-only values, the same ones docker-compose uses: they exist so the
# manifests deploy with zero setup and are not real credentials. A real
# environment replaces this Secret instead of editing the file, e.g.:
#   kubectl create secret generic app-secrets --from-env-file=.env.production \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app: tech-challenge
type: Opaque
stringData:
  DB_USER: postgres
  DB_PASSWORD: postgres
  JWT_SECRET: demo-only-secret-with-at-least-32-characters
