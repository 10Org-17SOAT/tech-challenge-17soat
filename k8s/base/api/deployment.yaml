apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: tech-challenge-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          # Everything non-sensitive comes from the ConfigMap and everything
          # sensitive from the Secret, so changing how the API is configured is
          # a one-file edit. Both live in this single list: a second `envFrom`
          # key would silently replace the first one. Entries under `env` win
          # over `envFrom`, so keep this Deployment free of values that another
          # object also defines.
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
