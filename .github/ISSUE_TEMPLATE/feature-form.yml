name: Relatório de Bug
description: Envie um relatório de bug.
title: "[Feature]: "
labels:
  - feature
  - triage
projects:
  - tech-challenge-17soat
assignees:
  - tech-challenge-17soat
type: bug

body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reservar um tempo para preencher este relatório de bug!

  - type: input
    id: contact
    attributes:
      label: Dados de contato
      description: Como podemos entrar em contato com você caso precisemos de mais informações?
      placeholder: "ex. [email@example.com](mailto:email@example.com)"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: O que aconteceu?
      description: Conte também o que você esperava que acontecesse.
      placeholder: Conte-nos o que você está vendo!
      value: "Ocorreu um bug!"
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: Versão
      description: Qual versão do nosso software você está utilizando?
      options:
        - "1.0.2 (Padrão)"
        - "1.0.3 (Edge)"
      default: 0
    validations:
      required: true

  - type: dropdown
    id: browsers
    attributes:
      label: Em quais navegadores você está observando o problema?
      multiple: true
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge

  - type: textarea
    id: logs
    attributes:
      label: Saída de log relevante
      description: >-
        Copie e cole qualquer saída de log relevante. Ela será formatada
        automaticamente como código, portanto não é necessário utilizar crases.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Código de Conduta
      description: >-
        Ao enviar esta issue, você concorda em seguir o
        [Código de Conduta](https://example.com) deste projeto.
      options:
        - label: Concordo em seguir o Código de Conduta deste projeto
          required: true

  - type: upload
    id: screenshots
    attributes:
      label: Enviar capturas de tela
      description: >-
        Se aplicável, adicione capturas de tela para ajudar a explicar o problema.
    validations:
      required: false
