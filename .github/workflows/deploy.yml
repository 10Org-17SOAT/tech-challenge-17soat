name: CD - Deploy K8s

# Deploys a commit to AWS, in three jobs that each stop the next on failure:
#
#   infra ──► db-migrate ──► deploy
#
#   infra       terraform plan → guard (no delete/replace) → apply of infra/
#   db-migrate  rds-ca + app-secrets, then the migration Job of the new image
#   deploy      the API rollout (k8s/overlays/aws)
#
# Building and pushing the image is not done here: the image workflow (cd.yml)
# calls this one once the push to Docker Hub succeeds:
#
#   deploy:
#     needs: image
#     uses: ./.github/workflows/deploy.yml
#     with:
#       image: ${{ needs.image.outputs.image }}
#       ref: ${{ github.event.workflow_run.head_sha }}
#     secrets: inherit
#
# It can also be run by hand from the Actions tab (from main), to redeploy or
# roll back to any tag already in the registry.
#
# Every job runs in the `production` environment, which only admits main and
# holds what the jobs need (infra/README.md, section 13):
#   secrets    AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, SSH_PRIVATE_KEY,
#              JWT_SECRET, BOOTSTRAP_ADMIN_EMAIL, BOOTSTRAP_ADMIN_PASSWORD
#   variables  TF_STATE_BUCKET, AWS_REGION
on:
  workflow_call:
    inputs:
      image:
        description: Full image reference with a tag or digest, e.g. <DOCKERHUB_IMAGE>:<sha>
        required: true
        type: string
      # Under workflow_run, github.sha is the tip of the default branch, not
      # the commit CI tested and the image was built from. The caller passes
      # that commit so Terraform and the manifests match the image. Empty = the
      # triggering ref.
      ref:
        description: Commit to check out for Terraform and the manifests; defaults to the triggering ref.
        required: false
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      image:
        description: Full image reference with a tag or digest, e.g. <DOCKERHUB_IMAGE>:<sha>
        required: true
        type: string
      ref:
        description: Commit to check out for Terraform and the manifests; empty = the selected branch.
        required: false
        type: string
        default: ""

permissions:
  contents: read

# The whole chain is one unit: two deploys racing would interleave applies and
# migrations, so they queue instead. A running deploy is never cancelled
# halfway through an apply or a rollout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  infra:
    name: Terraform apply
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Same version as tf-outputs; the wrapper is off so `show -json` writes
      # clean JSON.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: terraform init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"

      - name: terraform plan
        run: |
          terraform plan -input=false -lock-timeout=5m \
            -var-file=production.tfvars -out=plan.tfplan
          terraform show -json plan.tfplan > plan.json

      - name: Publish plan summary
        if: always()
        run: |
          [ -f plan.tfplan ] || exit 0
          {
            echo "### Terraform plan"
            echo '```'
            terraform show -no-color plan.tfplan | grep -E '^ *# |^Plan:|^No changes' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Destroying or recreating anything (RDS, VM, EIP) is always done by hand.
      - name: Refuse deletes and replaces
        run: ../.github/scripts/terraform-plan-guard.sh plan.json

      - name: terraform apply
        run: terraform apply -input=false -lock-timeout=5m plan.tfplan

  db-migrate:
    name: Database migration
    needs: infra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      IMAGE: ${{ inputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform outputs
        id: tf
        uses: ./.github/actions/tf-outputs
        with:
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          aws-region: ${{ vars.AWS_REGION }}
          mail-from: ${{ vars.MAIL_FROM }}

      - name: Kubeconfig
        uses: ./.github/actions/kubeconfig
        with:
          host: ${{ steps.tf.outputs.k3s-public-ip }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Refreshed on every deploy so a CA rotation by AWS needs nothing more
      # than a new run. Applying a rendered object keeps it idempotent.
      - name: Apply RDS CA bundle
        run: |
          curl -fsSLo "$RUNNER_TEMP/global-bundle.pem" \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          kubectl create configmap rds-ca \
            --from-file=global-bundle.pem="$RUNNER_TEMP/global-bundle.pem" \
            --dry-run=client -o yaml | kubectl apply -f -

      # The database credentials come from the state in this very step and are
      # never a job output (those are stored in plain text). JWT_SECRET is a
      # fixed environment secret: regenerating it would log everybody out.
      - name: Apply application Secret
        working-directory: infra
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          for name in JWT_SECRET BOOTSTRAP_ADMIN_EMAIL BOOTSTRAP_ADMIN_PASSWORD BREVO_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set in the production environment (infra/README.md, section 13)."
              exit 1
            fi
          done

          db_user=$(terraform output -raw db_username)
          db_password=$(terraform output -raw db_password)
          echo "::add-mask::$db_password"

          kubectl create secret generic app-secrets \
            --from-literal=DB_USER="$db_user" \
            --from-literal=DB_PASSWORD="$db_password" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=BOOTSTRAP_ADMIN_EMAIL="$BOOTSTRAP_ADMIN_EMAIL" \
            --from-literal=BOOTSTRAP_ADMIN_PASSWORD="$BOOTSTRAP_ADMIN_PASSWORD" \
            --from-literal=BREVO_API_KEY="$BREVO_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render migration Job
        run: .github/scripts/render-overlay.sh k8s/overlays/aws-migrate "$IMAGE" "$RUNNER_TEMP/migrate.yaml"

      # A Job's pod template is immutable, so the previous run's Job is
      # replaced rather than patched.
      - name: Run migration Job
        run: |
          kubectl delete job db-migrate --ignore-not-found --wait=true
          kubectl apply -f "$RUNNER_TEMP/migrate.yaml"

          # Waits for either outcome: `kubectl wait` alone would sit until the
          # timeout on a failed Job. The Job's own deadline is 300s.
          for _ in $(seq 1 72); do
            succeeded=$(kubectl get job db-migrate -o jsonpath='{.status.succeeded}')
            failed=$(kubectl get job db-migrate -o jsonpath='{.status.failed}')
            if [ "${succeeded:-0}" -ge 1 ]; then
              kubectl logs job/db-migrate --all-containers
              exit 0
            fi
            if [ "${failed:-0}" -ge 1 ]; then
              echo "::error::The migration Job failed; the API was not rolled out."
              exit 1
            fi
            sleep 5
          done
          echo "::error::The migration Job did not finish in 6 minutes."
          exit 1

      - name: Describe failure
        if: failure()
        run: |
          kubectl describe job db-migrate || true
          kubectl get pods -l app=db-migrate -o wide || true
          kubectl logs -l app=db-migrate --all-containers --tail=200 --prefix || true
          kubectl get events --sort-by=.lastTimestamp | tail -n 30 || true

  deploy:
    name: Apply manifests
    needs: db-migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      IMAGE: ${{ inputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform outputs
        id: tf
        uses: ./.github/actions/tf-outputs
        with:
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          aws-region: ${{ vars.AWS_REGION }}
          mail-from: ${{ vars.MAIL_FROM }}

      - name: Kubeconfig
        uses: ./.github/actions/kubeconfig
        with:
          host: ${{ steps.tf.outputs.k3s-public-ip }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Render manifests
        run: .github/scripts/render-overlay.sh k8s/overlays/aws "$IMAGE" "$RUNNER_TEMP/manifests.yaml"

      # `kubectl diff` exits 1 when there are differences, which is the normal
      # case here; only a higher code means it actually failed.
      - name: Show changes
        run: |
          kubectl diff -f "$RUNNER_TEMP/manifests.yaml" || [ $? -eq 1 ]

      - name: Apply manifests
        env:
          COMMIT: ${{ inputs.ref || github.sha }}
        run: |
          kubectl apply -f "$RUNNER_TEMP/manifests.yaml"
          kubectl annotate deployment/api --overwrite \
            kubernetes.io/change-cause="$IMAGE (run $GITHUB_RUN_ID, $COMMIT)"

      # The readiness probe only passes once Nest is listening (the entrypoint's
      # own migration run is a no-op after db-migrate), so a finished rollout
      # means the new version is serving. A failed one leaves the previous pods
      # in place: the rolling update never removes them before the new ones are
      # ready.
      - name: Wait for rollout
        run: kubectl rollout status deployment/api --timeout=5m

      - name: Describe failure
        if: failure()
        run: |
          kubectl get pods -l app=api -o wide || true
          kubectl describe deployment/api || true
          kubectl get events --sort-by=.lastTimestamp | tail -n 30 || true
          kubectl logs -l app=api --all-containers --tail=100 --prefix || true
